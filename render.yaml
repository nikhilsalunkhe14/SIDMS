services:
  # Frontend Service (React)
  - type: web
    name: sidms-frontend
    env: node
    rootDir: sidms-frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    staticPublishPath: ./dist
    envVars:
      - key: NODE_ENV
        value: production
    healthCheckPath: /
    
  # Backend Service (Python Flask)
  - type: web
    name: sidms-backend
    env: python
    rootDir: sidms-python-backend
    buildCommand: pip install -r requirements-vercel.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.10
      - key: PORT
        value: 5000
    healthCheckPath: /health
